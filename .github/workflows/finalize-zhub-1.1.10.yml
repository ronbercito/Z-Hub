name: Finalize Z-Hub 1.1.10

on:
  push:
    branches:
      - update-zhub-theme-1.1.10

permissions:
  contents: write

jobs:
  finalize:
    if: github.event.head_commit.message == 'Finalize Z-Hub 1.1.10 v2'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout staging
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: update-zhub-theme-1.1.10

      - name: Update continuity documents
        env:
          CONTINUITY_SCRIPT_B64: ""
        run: |
          printf '%s' "$CONTINUITY_SCRIPT_B64" | base64 -d > /tmp/update_continuity.py
          python /tmp/update_continuity.py

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install frontend dependencies
        working-directory: frontend
        run: yarn install

      - name: Production build
        working-directory: frontend
        env:
          CI: 'false'
        run: yarn build

      - name: Validate backend syntax
        run: python -m py_compile backend/app/models/setting.py backend/app/routers/ajustes/router.py

      - name: Remove temporary workflows and commit final tree
        run: |
          git rm .github/workflows/validate-zhub-1.1.10.yml
          git rm .github/workflows/rebase-zhub-safe.yml
          git rm .github/workflows/finalize-zhub-1.1.10.yml
          git config user.name "ronbercito"
          git config user.email "rj.ston1985@gmail.com"
          git add docs/CONTINUIDAD_MIKROHUB.md docs/CONTINUIDAD_MIKROHUB_1.1.10_ZHUB_TEMAS.md
          git commit -m "Continuidad: cerrar Z-Hub 1.1.10 con build validado"
          git push origin update-zhub-theme-1.1.10
