name: Close migration continuity 1.1.12

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  close:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Update continuity documents
        run: python scripts/close_migration_docs_1_1_12.py

      - name: Commit closure and clean temporary files
        run: |
          rm -f .github/workflows/close-migration-docs-1.1.12.yml scripts/close_migration_docs_1_1_12.py
          git config user.name "ronbercito"
          git config user.email "rj.ston1985@gmail.com"
          git add -A
          git commit -m "Continuidad: migración a Z-Hub completada"
          git push origin main
