name: Apply MikroHub 1.0.26 UI fixes

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  apply-fixes:
    if: ${{ !contains(github.event.head_commit.message, 'aplicar ajustes de formulario cliente 1.0.26') && !contains(github.event.head_commit.message, 'fix(clientes): formulario resumen 1.0.26') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch client detail
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('frontend/src/modules/clientes/ClientDetail.jsx')
          s = p.read_text(encoding='utf-8')

          s = s.replace(
              ' * Actualización: 2026-09-08 — sincroniza Resumen y Servicio con el listado general tras guardar.',
              ' * Actualización: 2026-09-08 — versión 1.0.26: campos obligatorios, Google Maps y cierre del editor.'
          )

          s = s.replace(
              '  const handleSummaryFormChange = (e) => {',
              '''  useEffect(() => {
    const handleBackdropClick = (event) => {
      if (event.target === event.currentTarget && event.currentTarget.dataset.clientDetailBackdrop === "true") {
        onClose?.();
      }
    };
    document.addEventListener("mousedown", handleBackdropClick);
    return () => document.removeEventListener("mousedown", handleBackdropClick);
  }, [onClose]);

  const openGoogleMaps = () => {
    const query = [summaryFormData.address, summaryFormData.reference, zones.find((zone) => zone.id === summaryFormData.zone_id)?.name]
      .filter(Boolean).join(", ");
    if (!query) {
      setSummaryError("Ingresa la dirección o selecciona una zona antes de abrir Google Maps.");
      return;
    }
    window.open(`https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(query)}`, "_blank", "noopener,noreferrer");
  };

  const handleSummaryFormChange = (e) => {'''
          )

          s = s.replace(
              '      if (!summaryFormData.dni_ruc.trim()) {\n        throw new Error("El DNI/RUC es obligatorio.");\n      }',
              '      if (!summaryFormData.dni_ruc.trim()) {\n        throw new Error("El DNI/RUC es obligatorio.");\n      }\n      if (!summaryFormData.phone.trim()) {\n        throw new Error("El celular / WhatsApp es obligatorio.");\n      }'
          )

          old = '''      setSummarySuccess("Datos del cliente actualizados correctamente.");
      setTimeout(() => {
        const reload = async () => {
          try {
            const response = await axios.get(`${api}/clients/${clientId}`, {
              headers: { Authorization: `Bearer ${token}` }
            });
            setClient(response.data);
            onClientUpdated?.();
            setSummaryFormData({
              full_name: response.data.full_name || "",
              dni_ruc: response.data.dni_ruc || "",
              phone: response.data.phone || "",
              email: response.data.email || "",
              address: response.data.address || "",
              reference: response.data.reference || "",
              installation_date: response.data.installation_date || "",
              zone_id: response.data.zone_id || "",
              latitude: response.data.latitude ? String(response.data.latitude) : "",
              longitude: response.data.longitude ? String(response.data.longitude) : ""
            });
          } catch (err) {
            console.error("Error recargando cliente:", err);
          }
        };
        reload();
      }, 1500);'''
          new = '''      onClientUpdated?.();
      onClose?.();'''
          if old not in s:
              raise SystemExit('No se encontró el bloque de guardado esperado')
          s = s.replace(old, new, 1)

          s = s.replace(
              '                    placeholder="Celular / WhatsApp"\n                    className=',
              '                    placeholder="Celular / WhatsApp"\n                    required\n                    className=',
              1
          )

          s = s.replace(
              '''                  <input
                    type="text"
                    name="address"
                    value={summaryFormData.address}
                    onChange={handleSummaryFormChange}
                    placeholder="Dirección de instalación"
                    className="w-full rounded-xl border border-slate-700 bg-slate-950 px-3 py-2 text-sm text-slate-200 placeholder-slate-600 focus:border-cyan-500 focus:outline-none"
                  />''',
              '''                  <div className="flex flex-col gap-2 sm:flex-row">
                    <input
                      type="text"
                      name="address"
                      value={summaryFormData.address}
                      onChange={handleSummaryFormChange}
                      placeholder="Dirección de instalación"
                      className="min-w-0 flex-1 rounded-xl border border-slate-700 bg-slate-950 px-3 py-2 text-sm text-slate-200 placeholder-slate-600 focus:border-cyan-500 focus:outline-none"
                    />
                    <button
                      type="button"
                      onClick={openGoogleMaps}
                      className="inline-flex shrink-0 items-center justify-center gap-2 rounded-xl border border-cyan-500/40 bg-cyan-500/10 px-4 py-2 text-sm font-semibold text-cyan-300 transition hover:bg-cyan-500/20"
                      title="Buscar esta dirección en Google Maps"
                    >
                      <MapPin className="h-4 w-4" /> Google Maps
                    </button>
                  </div>''',
              1
          )

          s = s.replace(
              '  Radio, ReceiptText, Ticket, UserRound, Wifi, X, AlertCircle, CheckCircle2, Loader, Save',
              '  Radio, ReceiptText, Ticket, UserRound, Wifi, X, AlertCircle, CheckCircle2, Loader, Save, MapPin'
          )

          s = s.replace(
              '<div className="fixed inset-0 z-[70] flex items-center justify-center bg-slate-950/85 p-3 backdrop-blur-sm sm:p-6">',
              '<div data-client-detail-backdrop="true" onMouseDown={(event) => { if (event.target === event.currentTarget) onClose?.(); }} className="fixed inset-0 z-[70] flex items-center justify-center bg-slate-950/85 p-3 backdrop-blur-sm sm:p-6">',
              1
          )

          p.write_text(s, encoding='utf-8')
          PY

          python - <<'PY'
          from pathlib import Path
          p = Path('backend/app/routers/clientes/router.py')
          s = p.read_text(encoding='utf-8')
          needle = '    updates = data.model_dump(exclude_unset=True)\n\n    # Normaliza campos de texto vacíos antes de las validaciones del servicio.'
          replacement = '    updates = data.model_dump(exclude_unset=True)\n    if "phone" in updates and not str(updates["phone"] or "").strip():\n        raise HTTPException(status_code=422, detail="El celular / WhatsApp es obligatorio.")\n\n    # Normaliza campos de texto vacíos antes de las validaciones del servicio.'
          if needle in s:
              s = s.replace(needle, replacement, 1)
              p.write_text(s, encoding='utf-8')
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/src/modules/clientes/ClientDetail.jsx backend/app/routers/clientes/router.py
          git diff --cached --check
          git commit -m "fix(clientes): formulario resumen 1.0.26"
          git push
