name: One-time Stage7 Hardening 1.2.79

on:
  push:
    branches:
      - work/stage7-hardening-1.2.79

permissions:
  contents: write

jobs:
  apply-hardening:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/stage7-hardening-1.2.79
          fetch-depth: 0
      - name: Apply final Stage 7 hardening
        run: python .github/scripts/apply_stage7_hardening_1_2_79.py
      - name: Validate hardening
        run: |
          python -m compileall -q license_server/app backend
          node --check license_server/static/app.js
          python -m pip install -q pytest pytest-xdist
          pytest -q backend/tests/test_license_center_web_contract.py
      - name: Commit final Stage 7 hardening
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A license_server/static/app.js backend/tests/test_license_center_web_contract.py frontend/src/modules/system-update/version.js docs/CONTINUIDAD_Z-HUB.md docs/CONTINUIDAD_Z-HUB-1.2.71.md
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi
          git commit -m 'release: Z-Hub 1.2.79 hardening final Etapa 7/7'
          git push origin HEAD:work/stage7-hardening-1.2.79
