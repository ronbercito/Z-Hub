name: One-time license env persistence 1.2.77

on:
  push:
    branches:
      - work/license-env-persistence-1.2.77

permissions:
  contents: write

jobs:
  apply-hotfix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/license-env-persistence-1.2.77
          fetch-depth: 0
      - name: Apply 1.2.77 hotfix and continuity
        shell: bash
        run: |
          python -c "import base64; exec(base64.b64decode('      ').decode())"
          if git diff --quiet -- deploy/install.sh deploy/supervisor/zhub_backend.conf.template backend/tests/test_license_stage6_contract.py frontend/src/modules/system-update/version.js docs/CONTINUIDAD_Z-HUB.md; then
            echo 'Hotfix already applied; nothing to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add deploy/install.sh deploy/supervisor/zhub_backend.conf.template backend/tests/test_license_stage6_contract.py frontend/src/modules/system-update/version.js docs/CONTINUIDAD_Z-HUB.md
          git commit -m 'fix: preservar License Server al actualizar 1.2.77'
          git push origin HEAD:work/license-env-persistence-1.2.77
