name: Continuidad temp 1.2.75
on:
  push:
    branches:
      - work/remote-license-1.2.75
permissions:
  contents: write
jobs:
  append:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/remote-license-1.2.75
      - name: Append continuity
        env:
          CONTINUITY_B64: ""
        run: |
          if grep -q '1.2.75 — 2026-09-11 — Activación remota PAID y TRIAL' docs/CONTINUIDAD_Z-HUB.md; then exit 0; fi
          printf '%s' "$CONTINUITY_B64" | base64 -d >> docs/CONTINUIDAD_Z-HUB.md
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/CONTINUIDAD_Z-HUB.md
          git commit -m 'docs: registrar continuidad Z-Hub 1.2.75'
          git push origin HEAD:work/remote-license-1.2.75
