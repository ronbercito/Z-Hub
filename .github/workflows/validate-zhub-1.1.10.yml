name: Validate Z-Hub 1.1.10

on:
  push:
    branches:
      - update-zhub-theme-1.1.10
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: yarn
          cache-dependency-path: frontend/yarn.lock

      - name: Install frontend dependencies
        working-directory: frontend
        run: yarn install --frozen-lockfile

      - name: Build frontend
        working-directory: frontend
        env:
          CI: 'false'
        run: yarn build

      - name: Validate Python syntax
        run: python -m py_compile backend/app/models/setting.py backend/app/routers/ajustes/router.py
