name: Update continuity branch policy

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  update-continuity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Append branch policy note
        env:
          NOTE_B64: 
        run: |
          python -c "from pathlib import Path; import base64, os; p=Path('docs/CONTINUIDAD_MIKROHUB.md'); s=p.read_text(encoding='utf-8'); note=base64.b64decode(os.environ['NOTE_B64']).decode('utf-8'); marker='## 25. Nota operativa — Política de ramas Git'; p.write_text(s if marker in s else s+note, encoding='utf-8')"

      - name: Commit continuity update and remove temporary workflow
        run: |
          rm -f .github/workflows/update-continuity-branches-note.yml
          git config user.name "ronbercito"
          git config user.email "rj.ston1985@gmail.com"
          git add -A
          git commit -m "Continuidad: documentar política de ramas Git"
          git push origin main
