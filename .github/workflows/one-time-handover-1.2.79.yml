name: One-time handover 1.2.79

on:
  push:
    branches:
      - work/handover-1.2.79

permissions:
  contents: write

jobs:
  handover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/handover-1.2.79
          fetch-depth: 0
      - name: Actualizar handover
        run: python .github/scripts/update_handover_1_2_79.py
      - name: Validar contenido
        run: |
          grep -q 'PUNTO DE CONTINUIDAD ACTUAL — 2026-09-11 — Z-Hub 1.2.79 / Licencias 7/7' docs/CONTINUIDAD_Z-HUB-v1.2.md
          grep -q 'Estado real de despliegues — NO asumir que `main` ya está instalado' docs/CONTINUIDAD_Z-HUB-v1.2.md
          grep -q 'Punto de continuidad integral 1.2.79 / License Center 7/7' docs/CONTINUIDAD_Z-HUB.md
          grep -q 'z2.*1.2.77' docs/CONTINUIDAD_Z-HUB-v1.2.md
          grep -q 'web-licencia' docs/CONTINUIDAD_Z-HUB-v1.2.md
          grep -q 'License Server' docs/CONTINUIDAD_Z-HUB-v1.2.md
      - name: Commit handover
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/CONTINUIDAD_Z-HUB-v1.2.md docs/CONTINUIDAD_Z-HUB.md
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi
          git commit -m 'docs: registrar handover integral Z-Hub 1.2.79 y licencias 7/7'
          git push origin HEAD:work/handover-1.2.79
