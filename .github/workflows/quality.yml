name: Z-Hub Quality

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate installer shell syntax
        run: bash -n install.sh deploy/install.sh backend/app/modules/system_update/run_update.sh
      - name: Compile Python
        run: python -m compileall -q backend/app backend/server.py
      - name: Install pytest for maintenance contracts
        run: python -m pip install 'pytest>=8,<9' 'pydantic>=2,<3'
      - name: Maintenance and equipment regression contracts
        run: pytest -q -c /dev/null backend/tests/test_maintenance_contracts.py backend/tests/test_equipment_stage2_contracts.py backend/tests/test_equipment_stage3_contracts.py backend/tests/test_stage4_theme_contract.py backend/tests/test_settings_home_navigation.py backend/tests/test_settings_modal_contract.py backend/tests/test_license_stage2_contract.py backend/tests/test_license_stage3_contract.py backend/tests/test_license_stage4_contract.py backend/tests/test_license_stage5_contract.py backend/tests/test_license_expired_redirect_contract.py backend/tests/test_license_status_hotfix_contract.py backend/tests/test_license_stage6_contract.py backend/tests/test_hwid_auto_trial_contract.py backend/tests/test_stage7_e2e_contract.py backend/tests/test_capacity_only_134_contract.py backend/tests/test_wizard_registration_135_contract.py backend/tests/test_license_contact_sync_136_contract.py backend/tests/test_service_capacity_138_contract.py backend/tests/test_individual_service_control_139_contract.py backend/tests/test_router_create_1316_contract.py backend/tests/test_router_cards_1317_contract.py backend/tests/test_router_loading_1318_contract.py backend/tests/test_router_delete_visible_1319_contract.py backend/tests/test_router_delete_icon_1320_contract.py backend/tests/test_router_card_highlight_select_1321_contract.py backend/tests/test_router_card_center_click_1322_contract.py backend/tests/test_router_card_modern_1323_contract.py backend/tests/test_router_card_light_1324_contract.py backend/tests/test_router_card_contrast_1325_contract.py backend/tests/test_router_header_contrast_1326_contract.py backend/tests/test_router_identity_panel_1327_contract.py backend/tests/test_router_icon_contrast_1328_contract.py backend/tests/test_router_dhcp_metric_1331_contract.py backend/tests/test_traffic_registry_stage1_1332_contract.py backend/tests/test_traffic_registry_stage2_1333_contract.py

  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v5
        with:
          node-version: '20'
      - name: Install frontend dependencies
        working-directory: frontend
        run: yarn install --network-timeout 100000 --non-interactive
      - name: Build frontend
        working-directory: frontend
        env:
          CI: 'false'
          DISABLE_ESLINT_PLUGIN: 'true'
          REACT_APP_BACKEND_URL: ''
        run: yarn build
