name: Z-Hub Quality

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate installer shell syntax
        run: bash -n install.sh deploy/install.sh backend/app/modules/system_update/run_update.sh license_server/scripts/generate_keys.sh
      - name: Compile Python
        run: python -m compileall -q backend/app backend/server.py license_server/app
      - name: Install pytest for maintenance contracts
        run: python -m pip install 'pytest>=8,<9'
      - name: Maintenance and equipment regression contracts
        run: pytest -q -c /dev/null backend/tests/test_maintenance_contracts.py backend/tests/test_equipment_stage2_contracts.py backend/tests/test_equipment_stage3_contracts.py backend/tests/test_stage4_theme_contract.py backend/tests/test_settings_home_navigation.py backend/tests/test_settings_modal_contract.py backend/tests/test_license_stage2_contract.py backend/tests/test_license_stage3_contract.py backend/tests/test_license_stage4_contract.py backend/tests/test_license_stage5_contract.py backend/tests/test_license_expired_redirect_contract.py backend/tests/test_license_status_hotfix_contract.py backend/tests/test_license_stage6_contract.py backend/tests/test_license_center_web_contract.py

  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v5
        with:
          node-version: '20'
      - name: Install frontend dependencies
        working-directory: frontend
        run: yarn install --network-timeout 100000 --non-interactive
      - name: Build frontend
        working-directory: frontend
        env:
          CI: 'false'
          DISABLE_ESLINT_PLUGIN: 'true'
          REACT_APP_BACKEND_URL: ''
        run: yarn build
