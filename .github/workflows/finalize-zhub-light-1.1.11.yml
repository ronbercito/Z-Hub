name: Finalize Z-Hub 1.1.11

on:
  push:
    branches: [update-zhub-light-1.1.11]

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: update-zhub-light-1.1.11

      - name: Update continuity
        run: python scripts/finalize_zhub_1_1_11.py

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install frontend dependencies
        working-directory: frontend
        run: yarn install

      - name: Build frontend
        working-directory: frontend
        env:
          CI: "false"
        run: yarn build

      - name: Validate Python syntax
        run: python -m py_compile backend/app/models/setting.py backend/app/routers/ajustes/router.py

      - name: Commit validated continuity
        run: |
          git config user.name "ronbercito"
          git config user.email "rj.ston1985@gmail.com"
          git rm .github/workflows/finalize-zhub-light-1.1.11.yml scripts/finalize_zhub_1_1_11.py
          git add docs/CONTINUIDAD_MIKROHUB.md docs/CONTINUIDAD_MIKROHUB_1.1.11_TEMA_CLARO.md
          git commit -m "Continuidad: cerrar Z-Hub 1.1.11 con build validado"
          git push origin HEAD:update-zhub-light-1.1.11
