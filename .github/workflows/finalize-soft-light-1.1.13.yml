name: Finalize Z-Hub 1.1.13 Soft Light

on:
  push:
    branches:
      - update-soft-light-1.1.13

permissions:
  contents: write

jobs:
  validate:
    if: "${{ github.event.head_commit.message != 'Continuidad: cerrar Z-Hub 1.1.13 validada' }}"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Update continuity master
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('docs/CONTINUIDAD_MIKROHUB.md')
          s = p.read_text(encoding='utf-8')
          s = s.replace('**Antes de modificar MikroHub, leer este archivo completo y revisar el estado real de `main`.**', '**Antes de modificar Z-Hub, leer este archivo completo y revisar el estado real de `main` en `ronbercito/Z-Hub`.**', 1)
          s = s.replace('Cada vez que se **agregue, modifique o corrija** algo en MikroHub:', 'Cada vez que se **agregue, modifique o corrija** algo en Z-Hub:', 1)
          s = s.replace('- Versión funcional actual: **1.1.12**, correspondiente a la migración del desarrollo a `ronbercito/Z-Hub` y al actualizador con consulta dual Z-Hub/MikroHub.', '- Versión funcional actual: **1.1.13**, correspondiente al refinamiento de baja luminancia del template Z-Hub Claro Suave. El repositorio principal y autoritativo es `ronbercito/Z-Hub`.', 1)
          s = s.replace('PANEL_VERSION = 1.1.11', 'PANEL_VERSION = 1.1.13', 1)
          marker = '## 24. Registro de continuidad — 2026-09-09 — Panel 1.1.13'
          if marker not in s:
              s += '''\n\n---\n\n## 24. Registro de continuidad — 2026-09-09 — Panel 1.1.13\n\n**Tipo:** UX visual / reducción de luminancia / continuidad / repositorio definitivo.\n\n### Regla definitiva de repositorio\n\nA partir de esta entrega, **todo trabajo nuevo se realiza en `ronbercito/Z-Hub`**: desarrollo, correcciones, documentación, pruebas y publicación.\n\n`ronbercito/mirkohub` queda exclusivamente como repositorio legado/fallback del actualizador dual. No debe recibir nuevas funciones salvo rollback o emergencia expresamente documentada.\n\n### Motivo\n\nEl administrador confirmó que el template claro seguía teniendo demasiado brillo blanco y resultaba molesto para la vista durante uso prolongado.\n\n### Solución\n\nEl tema persistido `zhub-light` se conserva para no perder preferencias existentes, pero su presentación visible cambia a **Z-Hub Claro Suave**.\n\nSe reduce la luminancia de manera más marcada:\n\n- fondo general `#d7e0e9`;\n- tarjetas/superficies `#e7edf3`;\n- superficies secundarias `#dde5ed`;\n- sidebar/header `#e3e9f0`;\n- campos `#e8edf3`;\n- bordes gris-azulados más sobrios;\n- hovers menos luminosos;\n- sombras y gradientes casi neutros.\n\nNo se usa blanco puro como superficie normal del template claro. El blanco se reserva para texto sobre acciones/estados de color cuando aporta contraste.\n\n### Archivos modificados\n\n- `frontend/src/modules/appearance/panel-theme.css`;\n- `frontend/src/modules/appearance/panelThemes.js`;\n- `frontend/src/modules/system-update/version.js`;\n- `docs/CONTINUIDAD_MIKROHUB.md`;\n- `docs/CONTINUIDAD_MIKROHUB_1.1.13_TEMA_CLARO_SUAVE.md`.\n\n### Backup\n\nRama previa: `backup-pre-soft-light-1.1.13`, creada desde `ff71f9ae621cf196dff4cd21fd217f3a87eab602`.\n\n### Compatibilidad\n\nNo se modifican lógica funcional, base de datos, Clientes, Facturación, MikroTik, OLT, permisos, autenticación ni el tema oscuro clásico. El identificador persistido `zhub-light` permanece sin cambios.\n\n### Pruebas\n\n- [x] backup previo creado en `ronbercito/Z-Hub`;\n- [x] cambios aislados en rama `update-soft-light-1.1.13`;\n- [x] `PANEL_VERSION` actualizado a 1.1.13;\n- [x] identificador interno `zhub-light` preservado;\n- [x] build React de producción ejecutado en GitHub Actions;\n- [x] continuidad maestra actualizada en la misma entrega;\n- [ ] validación visual real después de instalar 1.1.13 en el servidor.\n\n### Resultado esperado\n\nEl template debe seguir siendo claro, pero notablemente menos brillante, con una base gris-azulada suave y sin grandes superficies blancas que fatiguen la vista.\n'''
          p.write_text(s, encoding='utf-8')
          PY

      - name: Validate version and theme identity
        run: |
          grep -q 'PANEL_VERSION = "1.1.13"' frontend/src/modules/system-update/version.js
          grep -q 'PANEL_THEME_ZHUB_LIGHT = "zhub-light"' frontend/src/modules/appearance/panelThemes.js
          grep -q '#d7e0e9' frontend/src/modules/appearance/panel-theme.css
          grep -q 'ronbercito/Z-Hub' docs/CONTINUIDAD_MIKROHUB.md

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'yarn'
          cache-dependency-path: frontend/yarn.lock

      - name: Install frontend dependencies
        working-directory: frontend
        run: yarn install --frozen-lockfile

      - name: Production build
        working-directory: frontend
        env:
          CI: 'false'
        run: yarn build

      - name: Commit validated continuity and remove temporary workflow
        run: |
          rm -f .github/workflows/finalize-soft-light-1.1.13.yml
          git config user.name "ronbercito"
          git config user.email "rj.ston1985@gmail.com"
          git add -A
          git commit -m "Continuidad: cerrar Z-Hub 1.1.13 validada"
          git push origin update-soft-light-1.1.13
