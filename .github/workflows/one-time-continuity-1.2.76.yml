name: One-time continuity 1.2.76

on:
  push:
    branches:
      - work/remote-trial-dates-1.2.76

permissions:
  contents: write

jobs:
  append-continuity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/remote-trial-dates-1.2.76
          fetch-depth: 0
      - name: Append canonical continuity entry once
        shell: bash
        env:
          CONTINUITY_B64: 
        run: |
          set -euo pipefail
          FILE='docs/CONTINUIDAD_Z-HUB.md'
          MARKER='### 1.2.76 — 2026-09-11 — Vencimiento TRIAL central y cierre operativo de Etapa 6'
          if grep -Fq "$MARKER" "$FILE"; then
            echo 'Continuity entry already present; nothing to commit.'
            exit 0
          fi
          python -c "import base64,os,pathlib; p=pathlib.Path('docs/CONTINUIDAD_Z-HUB.md'); p.write_text(p.read_text(encoding='utf-8').rstrip()+base64.b64decode(os.environ['CONTINUITY_B64']).decode('utf-8')+'\n', encoding='utf-8')"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$FILE"
          git commit -m 'docs: cerrar Etapa 6 y documentar 1.2.76'
          git push origin HEAD:work/remote-trial-dates-1.2.76
